<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>買い物リマインダー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4caf50">
</head>
<body>
    <div id="pin-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:1000;overflow:auto;backdrop-filter:blur(4px);">
        <div style="background:white;padding:2.5rem;border-radius:16px;text-align:center;max-width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
            <p id="pin-message" style="margin-top:0;font-size:1.1rem;color:#333;font-weight:500;margin-bottom:1.5rem;">PINを入力してください（数字4〜6桁）</p>
            <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="0000" style="padding:0.9rem;font-size:1.2rem;width:100%;border:2px solid #e0e0e0;border-radius:8px;letter-spacing:0.2em;text-align:center;margin-bottom:1.5rem;transition:all 0.3s;"><br>
            <button id="pin-submit" type="button" style="padding:0.9rem 2rem;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;box-shadow:0 4px 12px rgba(102,126,234,0.3);transition:all 0.3s;">OK</button>
        </div>
    </div>
    <header>
        <h1>買い物リマインダー</h1>
    </header>

    <main>
        <form id="item-form">
            <input type="text" id="item-input" placeholder="買い物リストを入力" required>
            <input type="datetime-local" id="reminder-time">
            <button type="submit">追加</button>
        </form>

        <ul id="item-list"></ul>
    </main>

    <div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;max-height:150px;overflow:auto;background:rgba(50,50,50,0.95);color:#0f0;font-size:0.75rem;padding:0.8rem;z-index:10000;font-family:monospace;border-top:2px solid #667eea;backdrop-filter:blur(10px);">
        <strong style="color:#667eea;">► DEBUG LOG</strong><br>
    </div>
    <script src="script.js"></script>
</body>
</html>
