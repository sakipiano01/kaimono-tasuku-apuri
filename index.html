<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>買い物リマインダー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4caf50">
</head>
<body>
    <div id="pin-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#000000bb;display:flex;align-items:center;justify-content:center;z-index:1000;overflow:auto;">
        <div style="background:#fff;padding:2rem;border-radius:8px;text-align:center;max-width:90%;">
            <p id="pin-message">PINを入力してください（数字4〜6桁）</p>
            <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="0000" style="padding:0.5rem;font-size:1rem;width:100%;"><br><br>
            <button id="pin-submit" type="button" style="padding:0.5rem 1rem;">OK</button>
        </div>
    </div>
    <header>
        <h1>買い物リマインダー</h1>
    </header>

    <main>
        <form id="item-form">
            <input type="text" id="item-input" placeholder="買い物リストを入力" required>
            <input type="datetime-local" id="reminder-time">
            <button type="submit">追加</button>
        </form>

        <ul id="item-list"></ul>
    </main>

    <div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;max-height:150px;overflow:auto;background:#fff;color:#000;font-size:0.8rem;padding:0.5rem;z-index:10000;">
        <strong>DEBUG LOG</strong><br>
    </div>
    <script src="script.js"></script>
</body>
</html>
